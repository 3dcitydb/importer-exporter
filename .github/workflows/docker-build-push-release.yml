name: docker-build-push-release

on:
  release:
    types: [ released, edited ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
      - name: Get release version
        id: release_version
        env:
          REF_NAME: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          version="${REF_NAME}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "version-without-v=${version#v}" >> "$GITHUB_OUTPUT"
      - name: Docker login
        id: docker_login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and push image
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: 3dcitydb/impexp:${{ steps.release_version.outputs.version-without-v }},3dcitydb/impexp:latest
          build-args: |
            IMPEXP_VERSION=${{ steps.release_version.outputs.version }}
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
      - name: Run container
        run: docker run -t --rm 3dcitydb/impexp:${{ steps.release_version.outputs.version-without-v }} help | grep -i -E "Usage:"
